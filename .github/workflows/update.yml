name: Update Strong EPG
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'

permissions:
  contents: write

concurrency:
  group: strong-epg-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate guide
        env:
          STRONG_EPG_URL: ${{ secrets.STRONG_EPG_URL }}
        run: python build.py --output Strong-EPG-with-logos.xml.gz
      - name: Publish validated guide
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Strong-EPG-with-logos.xml.gz
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update XMLTV guide'
          git push origin HEAD:main
